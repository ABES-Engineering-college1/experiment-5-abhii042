<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h2 align="center">Student Registration Form</h2>
    <hr>
    <form action="submit.html" method="post">
        <label for="full name">Full Name:</label>
        <input type="text" id="full name" name="Full name" placeholder="Enter your full name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="Email" placeholder="Enter valid email address" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="Password" placeholder="Enter password" required><br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="gender" name="Gender" value="Male" required>Male
        <input type="radio" id="gender" name="Gender" value="Female" required>Female 
        <input type="radio" id="gender" name="Gender" value="Other" required>Other<br><br>
        <label>Course:</label>
        <select name="course" id="course">
            <option>-- Select Course --</option>
            <option value="BCA">BCA</option>
            <option value="B.tech">B.tech</option>
            <option value="MCA">MCA</option>
            <option value="M.tech">M.tech</option>
        </select>
        <br><br>
        <label for="phone">contat no:</label>
        <input type="tel" id="phone" name="Contact no" placeholder="Enter phone number" required><br><br>
        <label for="address">Address:</label><br>
        <textarea id="address" name="Address" placeholder="Enter your address" rows="4" cols="30" required></textarea><br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>
    <hr>
    <footer align="center">&copy; 2025 Student Registration Portal</footer>
</body>
</html>
